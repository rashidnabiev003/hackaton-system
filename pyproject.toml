[project]
name = "hackaton-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "lap>=0.5.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.9.0.80",
    "patched-yolo-infer>=1.3.8",
    "pandas>=2.2",
    "pandas-stubs>=2.1",
    "plotly>=5.24",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.39",
    "supervision>=0.21",
    "torchreid>=1.4.0",
    "typer>=0.12",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
]

[project.scripts]
dashboard = "hackaton_system.dashboard.__main__:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["hackaton_system"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=hackaton_system",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90"
]
asyncio_mode = "auto"

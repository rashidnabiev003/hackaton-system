services:
  dashboard:
    image: hackaton-system:latest
    container_name: hackaton-dashboard
    ports:
      - "8501:8501"
    environment:
      - HACKATON_DATABASE_URL=sqlite:///data/hackaton.db
      - HACKATON_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hackaton-network

networks:
  hackaton-network:
    driver: bridge
